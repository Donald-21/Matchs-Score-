name: Refresh football live scores

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-football-live-scores
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh fixtures and scores
        env:
          FOOTBALL_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          test -n "$FOOTBALL_TOKEN" || { echo "FOOTBALL_DATA_TOKEN manquant"; exit 1; }
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import subprocess

          token = os.environ["FOOTBALL_TOKEN"]
          today = dt.datetime.now(dt.timezone.utc).date()
          start = today - dt.timedelta(days=3)
          end = today + dt.timedelta(days=60)
          matches = {}

          def keep(obj, keys):
              obj = obj or {}
              return {key: obj[key] for key in keys if key in obj}

          def compact(m):
              return {
                  "id": m.get("id"),
                  "utcDate": m.get("utcDate"),
                  "status": m.get("status"),
                  "matchday": m.get("matchday"),
                  "stage": m.get("stage"),
                  "venue": m.get("venue"),
                  "competition": keep(m.get("competition"), ["id", "name", "code", "type", "emblem"]),
                  "homeTeam": keep(m.get("homeTeam"), ["id", "name", "shortName", "tla", "crest"]),
                  "awayTeam": keep(m.get("awayTeam"), ["id", "name", "shortName", "tla", "crest"]),
                  "score": keep(m.get("score"), ["winner", "duration", "fullTime", "regularTime", "halfTime"]),
                  "referees": [keep(r, ["id", "name", "type", "nationality"]) for r in m.get("referees", [])]
              }

          cursor = start
          while cursor <= end:
              stop = min(cursor + dt.timedelta(days=8), end)
              url = f"https://api.football-data.org/v4/matches?dateFrom={cursor:%Y-%m-%d}&dateTo={stop:%Y-%m-%d}"
              raw = subprocess.run(
                  ["curl", "--fail", "--silent", "--show-error", "--retry", "3",
                   "--retry-connrefused", "--retry-delay", "5", "--retry-max-time", "60",
                   "-H", f"X-Auth-Token: {token}", url],
                  capture_output=True, text=True, check=True
              ).stdout
              for match in json.loads(raw).get("matches", []):
                  matches[str(match["id"])] = compact(match)
              cursor = stop + dt.timedelta(days=1)

          payload = {
              "matches": list(matches.values()),
              "count": len(matches),
              "fetchedAt": dt.datetime.now(dt.timezone.utc).isoformat()
          }
          with open("matches.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, separators=(",", ":"))
          print(f"Scores et calendrier rafraîchis : {len(matches)} matchs.")
          PY
          python -m json.tool matches.json > /dev/null

      - name: Publish refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add matches.json
          if git diff --cached --quiet; then
            echo "Aucune modification des scores."
            exit 0
          fi
          git commit -m "Refresh football scores and fixtures"
          git pull --rebase origin main
          git push
