
name: Update football matches

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Fetch football data
        env:
          FOOTBALL_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          test -n "$FOOTBALL_TOKEN" || {
            echo "API token is missing"
            exit 1
          }

          curl --fail --silent --show-error \
            -H "X-Auth-Token: $FOOTBALL_TOKEN" \
            "https://api.football-data.org/v4/matches" \
            -o matches.json

          python -m json.tool matches.json > /dev/null
          echo "JSON valide : matches.json"

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches.json
          git diff --cached --quiet || {
            git commit -m "Update football matches"
            git push
          }
          
