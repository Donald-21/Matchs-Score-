name: Update football matches and predictions

on:
  workflow_dispatch:
  push:
    paths:
      - "generate_predictions.py"
      - ".github/workflows/update-matches.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: football-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch football data
        env:
          FOOTBALL_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          test -n "$FOOTBALL_TOKEN" || {
            echo "API token is missing"
            exit 1
          }

          DATE_FROM="$(date -u +%F)"
          DATE_TO="$(date -u -d '+8 days' +%F)"
          echo "Calendrier récupéré du $DATE_FROM au $DATE_TO (date de fin exclue)"

          curl --fail --silent --show-error \
            -H "X-Auth-Token: $FOOTBALL_TOKEN" \
            "https://api.football-data.org/v4/matches?dateFrom=$DATE_FROM&dateTo=$DATE_TO" \
            -o matches.json

          python -m json.tool matches.json > /dev/null
          echo "JSON valide : matches.json"
          python -c "import json; d=json.load(open('matches.json')); print('Nombre de matchs :', len(d.get('matches', [])))"

      - name: Generate statistical predictions
        env:
          FOOTBALL_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python generate_predictions.py
          python -m json.tool predictions.json > /dev/null

      - name: Fetch football news and match statistics\n        run: |\n          python fetch_news_stats.py\n          python -m json.tool news.json > /dev/null\n          python -m json.tool match_stats.json > /dev/null\n\n      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add matches.json predictions.json standings.json scorers.json news.json match_stats.json
          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi
          git commit -m "Update football matches and statistical predictions"
          git pull --rebase origin main
          git push
