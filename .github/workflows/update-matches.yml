name: Update football matches and predictions

on:
  workflow_dispatch:
  push:
    paths:
      - "generate_predictions.py"
      - "fetch_news_stats.py"
      - ".github/workflows/update-matches.yml"
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: football-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch football data
        env:
          FOOTBALL_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          test -n "$FOOTBALL_TOKEN" || {
            echo "API token is missing"
            exit 1
          }

          DATE_FROM="$(date -u -d '-90 days' +%F)"
          DATE_TO="$(date -u -d '+60 days' +%F)"
          echo "Historique et calendrier récupérés du $DATE_FROM au $DATE_TO"

          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 10 --retry-max-time 120 \
            -H "X-Auth-Token: $FOOTBALL_TOKEN" \
            "https://api.football-data.org/v4/competitions" -o competitions.json
          python -m json.tool competitions.json > /dev/null

          python - <<'PY'
          import datetime, json, os, subprocess
          start = datetime.date.today() - datetime.timedelta(days=90)
          end = datetime.date.today() + datetime.timedelta(days=60)
          token = os.environ["FOOTBALL_TOKEN"]
          matches = {}
          cursor = start

          def compact_match(match):
              def keep(source, keys):
                  return {key: source[key] for key in keys if key in source}
              return {
                  "id": match.get("id"),
                  "utcDate": match.get("utcDate"),
                  "status": match.get("status"),
                  "matchday": match.get("matchday"),
                  "stage": match.get("stage"),
                  "venue": match.get("venue"),
                  "competition": keep(match.get("competition") or {}, ["id", "name", "code", "type", "emblem"]),
                  "homeTeam": keep(match.get("homeTeam") or {}, ["id", "name", "shortName", "tla", "crest"]),
                  "awayTeam": keep(match.get("awayTeam") or {}, ["id", "name", "shortName", "tla", "crest"]),
                  "score": keep(match.get("score") or {}, ["winner", "duration", "fullTime", "regularTime", "halfTime"]),
                  "referees": [
                      keep(referee, ["id", "name", "type", "nationality"])
                      for referee in match.get("referees", [])
                  ]
              }

          while cursor <= end:
              stop = min(cursor + datetime.timedelta(days=8), end)
              url = f"https://api.football-data.org/v4/matches?dateFrom={cursor:%Y-%m-%d}&dateTo={stop:%Y-%m-%d}"
              result = subprocess.run(["curl","--fail","--silent","--show-error","--retry","5","--retry-connrefused","--retry-delay","10","-H",f"X-Auth-Token: {token}",url],capture_output=True,text=True,check=True)
              for match in json.loads(result.stdout).get("matches", []):
                  matches[str(match["id"])] = compact_match(match)
              cursor = stop + datetime.timedelta(days=1)
          with open("matches.json","w") as f:
              json.dump({"matches":list(matches.values()),"count":len(matches),"fetchedAt":datetime.datetime.now(datetime.timezone.utc).isoformat()},f,ensure_ascii=False,separators=(",",":"))
          print("Nombre de matchs récupérés (90 jours passés + 60 jours à venir) :",len(matches))
          PY
          python -m json.tool matches.json > /dev/null

      - name: Generate statistical predictions
        continue-on-error: true
        timeout-minutes: 8
        env:
          FOOTBALL_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python generate_predictions.py
          python -m json.tool predictions.json > /dev/null

      - name: Fetch football news and match statistics
        run: |
          python fetch_news_stats.py
          python -m json.tool news.json > /dev/null
          python -m json.tool match_stats.json > /dev/null

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add matches.json competitions.json predictions.json standings.json scorers.json news.json match_stats.json
          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi
          git commit -m "Update football matches and statistical predictions"
          git pull --rebase origin main
          git push
