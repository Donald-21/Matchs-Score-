name: Refresh live football scores

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-live-scores.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: football-data-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest fixtures and scores
        env:
          FOOTBALL_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          test -n "$FOOTBALL_TOKEN" || {
            echo "API token is missing"
            exit 1
          }

          DATE_FROM="$(date -u -d '-2 days' +%F)"
          DATE_TO="$(date -u -d '+7 days' +%F)"
          curl --fail --silent --show-error --retry 4 --retry-connrefused --retry-delay 5 --retry-max-time 90 \
            -H "X-Auth-Token: $FOOTBALL_TOKEN" \
            "https://api.football-data.org/v4/matches?dateFrom=$DATE_FROM&dateTo=$DATE_TO" \
            -o /tmp/live_matches.json

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          path = "matches.json"
          with open(path, encoding="utf-8") as f:
              existing = json.load(f)
          if not isinstance(existing.get("matches"), list):
              raise SystemExit("Invalid existing matches payload")
          with open("/tmp/live_matches.json", encoding="utf-8") as f:
              live = json.load(f)
          if not isinstance(live.get("matches"), list):
              raise SystemExit("Invalid live matches payload")
          # Merge the short live window into the full calendar instead of
          # replacing fixtures scheduled beyond the next seven days.
          merged = {str(match["id"]): match for match in existing["matches"] if match.get("id") is not None}
          for match in live["matches"]:
              if match.get("id") is not None:
                  merged[str(match["id"])] = match
          existing["matches"] = list(merged.values())
          existing["count"] = len(existing["matches"])
          existing["fetchedAt"] = datetime.now(timezone.utc).isoformat()
          with open(path, "w", encoding="utf-8") as f:
              json.dump(existing, f, ensure_ascii=False, indent=2)
          print(f"Valid merged feed: {len(live['matches'])} refreshed, {len(existing['matches'])} total matches")
          PY

      - name: Publish updated scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add matches.json
          if git diff --cached --quiet; then
            echo "No score changes to publish."
            exit 0
          fi
          git commit -m "Refresh live football scores"
          git pull --rebase origin main
          git push
